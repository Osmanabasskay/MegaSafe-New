<p class="text-on-surface-variant font-body-md">To ensure the security of our community, please provide a valid identification document.</p>
</div>
<div class="space-y-md">
<!-- ID Card Option -->
<button class="glass-card w-full p-md rounded-xl text-left flex items-start gap-md group hover:border-secondary transition-all active:scale-98">
<div class="p-base bg-primary-container rounded-lg flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="badge" style="font-size: 32px;">badge</span>
</div>
<div class="flex-grow">
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">National ID Card</h3>
<p class="text-label-md font-label-md text-on-surface-variant">A government-issued identity card with your photo and legal details.</p>
</div>
<div class="self-center">
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<!-- Passport Option - Selected State -->

<div class="p-base bg-secondary-container/20 rounded-lg flex items-center justify-center text-secondary-container">

</div>

</div>
</button>
