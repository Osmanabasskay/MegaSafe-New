<body class="bg-background text-on-surface font-body-md">
<!-- TopAppBar -->
<header class="bg-background dark:bg-surface-dim docked full-width top-0 z-50 flex justify-between items-center px-margin-mobile h-16 w-full">

<span class="material-symbols-outlined text-[16px] text-on-secondary-container" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-sm text-label-sm text-on-secondary-container">Captured</span>

</div>

<ul class="space-y-sm">
<li class="flex items-center gap-base">
<div class="flex-shrink-0 w-6 h-6 rounded-full bg-emerald-500/10 flex items-center justify-center">
<span class="material-symbols-outlined text-emerald-600 text-[18px]" data-icon="check">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant">Readable text</span>
</li>
<li class="flex items-center gap-base">

</div>

<li class="flex items-center gap-base">
