<style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .otp-input:focus {
            border-color: #FFA504;
            box-shadow: 0 0 0 2px rgba(255, 165, 4, 0.2);
            outline: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-white text-on-surface font-body-md antialiased min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full bg-white text-primary docked full-width top-0 z-50">
<div class="flex items-center gap-base">
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined text-headline-md">arrow_back</span>
</button>
</div>
<div class="text-headline-md font-headline-md font-bold text-secondary-container">
            Osusu
        </div>
<div class="w-8"></div> <!-- Spacer for centering title -->
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile">
<div class="w-full max-w-md bg-white p-md rounded-xl">
<!-- Header Section -->
<div class="mb-lg text-center md:text-left">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary-container mb-base">
                    Verify your email
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Enter the 6-digit code sent to <span class="font-bold text-primary-container">amina.chen@example.com</span>
</p>
</div>
<!-- OTP Input Section -->
<form action="#" class="space-y-lg" method="POST">
<div class="flex justify-between gap-xs sm:gap-base">
<input aria-label="Digit 1" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-md font-headline-md border-[1.5px] border-primary-container rounded-lg bg-white text-primary-container transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 2" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-md font-headline-md border-[1.5px] border-primary-container rounded-lg bg-white text-primary-container transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 3" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-md font-headline-md border-[1.5px] border-primary-container rounded-lg bg-white text-primary-container transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 4" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-md font-headline-md border-[1.5px] border-primary-container rounded-lg bg-white text-primary-container transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 5" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-md font-headline-md border-[1.5px] border-primary-container rounded-lg bg-white text-primary-container transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 6" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-md font-headline-md border-[1.5px] border-primary-container rounded-lg bg-white text-primary-container transition-all" maxlength="1" type="text"/>
</div>
<!-- Timer & Resend -->
<div class="text-center">
<p class="font-label-md text-label-md text-on-surface-variant">
                        Resend code in <span class="text-secondary-container font-bold">0:59</span>
</p>
</div>
<!-- Action Button -->
<div class="pt-base">
<button class="w-full bg-[#FFA500] text-primary-container font-bold py-4 rounded-xl shadow-[0_10px_30px_rgba(255,165,0,0.2)] hover:opacity-90 active:scale-[0.98] transition-all text-body-lg" type="submit">
                        Verify OTP
                    </button>
</div>
</form>
<!-- Supplemental Image/Illustration -->
<div class="mt-xl flex justify-center">
<div class="relative w-48 h-48 rounded-full overflow-hidden">
<img alt="Email security verification" class="w-full h-full object-cover opacity-80" data-alt="A highly detailed 3D digital illustration of a glowing holographic envelope floating above a secure digital keypad. The background is a clean, minimalist white environment with soft, ambient occlusion shadows. The aesthetic is modern fintech, featuring subtle amber and deep blue accents that align with the brand identity. The lighting is soft and cinematic, emphasizing a sense of security and technological sophistication." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBAcZ1VNS_jXF75FMQxH8jBNaeYmEtiycYL20VRoW3xhq90VkUwzoq9E_VbxjBnaGZsTAfpp0ew1iHqjW8QG8nme3XrBIj07w93yDoVi1LL9-ly7RJN5s-CJRs-xmCd4M0XYBK9hjVg58Xj2YJR-HgUGD7mlJZD33AN8G4oDON2xek97wPfX77NPK6mAt9X_3oPS3l1eZgtuh2VehHjjppedBevRRzPSfrxQjPZhW3Y8XknYGUNyu98Ke_au6zai9oyJE46VExL8Ng"/>
<div class="absolute inset-0 bg-gradient-to-t from-white/20 to-transparent"></div>
</div>
</div>
</div>
</main>
<!-- Support Footer -->
<footer class="py-md text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">
            Secured by Osusu Vault Technology
        </p>
</footer>
