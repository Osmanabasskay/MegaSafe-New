<style>

            background: rgba(28, 32, 38, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);

<body class="bg-background text-on-background min-h-screen font-body-md">
<!-- TopAppBar -->
<header class="flex items-center w-full px-margin-mobile h-16 bg-background docked full-width top-0 sticky z-50">
<button aria-label="Go back" class="hover:opacity-80 transition-opacity active:scale-95 transition-transform mr-4">
<span class="material-symbols-outlined text-primary text-headline-md">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-secondary">Osusu</h1>
</header>
<main class="px-margin-mobile flex flex-col justify-center min-h-[calc(100vh-64px)] max-w-md mx-auto">
<!-- Content Canvas -->
<div class="mb-xl text-center md:text-left">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container mb-md">
<span class="material-symbols-outlined text-primary text-4xl">lock_reset</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg mb-sm text-on-surface">Forgot Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your registered email to receive a password reset code.</p>
</div>
<!-- Form Section -->
<section class="glass-panel p-md rounded-xl shadow-lg">
<div class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">mail</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-white/10 border-none rounded-xl text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-secondary-container transition-all" id="email" name="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<button class="w-full bg-secondary-container text-on-secondary-container font-label-md text-label-md py-4 rounded-xl shadow-[0_4px_20px_rgba(255,165,4,0.3)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    Send Reset Code
                    <span class="material-symbols-outlined">send</span>
</button>
</div>
</section>
<!-- Footer Help -->
<div class="mt-lg text-center">
<p class="font-label-md text-label-md text-on-surface-variant">
                Remembered your password? 
                <a class="text-secondary font-bold hover:underline ml-1" href="#">Log In</a>
</p>
</div>
<!-- Decorative Background Element (Digital Vault Aesthetic) -->
<div class="fixed top-1/4 -right-24 w-64 h-64 bg-primary-container/20 blur-[100px] -z-10 rounded-full"></div>
<div class="fixed bottom-1/4 -left-24 w-64 h-64 bg-secondary-container/10 blur-[100px] -z-10 rounded-full"></div>
</main>
<!-- Visual Anchor Image (Bento-style background hint) -->

<div class="h-full w-full rounded-3xl overflow-hidden relative glass-panel">

<div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent"></div>
<div class="absolute bottom-xl left-md right-md">
<h3 class="font-headline-md text-headline-md text-on-surface mb-2">Secure &amp; Reliable</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Your prosperity is protected by world-class encryption and communal trust.</p>
</div>
