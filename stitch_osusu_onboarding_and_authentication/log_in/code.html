<body class="bg-primary-container text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full fixed top-0 z-50 bg-primary-container">
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-150 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<span class="text-headline-md font-headline-md font-bold text-secondary">Osusu</span>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow flex flex-col justify-center items-center px-margin-mobile pt-24 pb-12 w-full max-w-md mx-auto">
<!-- Hero Visual Section -->
<div class="w-full mb-lg text-center">
<h1 class="font-headline-xl text-headline-xl text-on-background mb-xs">Welcome Back</h1>
<p class="font-body-md text-on-surface-variant">Sign in to manage your contributions</p>
</div>
<!-- Login Form Container -->
<section class="w-full space-y-md">
<div class="space-y-sm">
<!-- Email/Phone Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Email or Phone Number</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="person">person</span>
<input class="w-full h-14 pl-12 pr-4 bg-white/10 border-transparent rounded-xl text-on-background placeholder:text-outline focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-all outline-none" placeholder="Enter your email or phone" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Password</label>
<a class="font-label-md text-label-md text-secondary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="lock">lock</span>
<input class="w-full h-14 pl-12 pr-12 bg-white/10 border-transparent rounded-xl text-on-background placeholder:text-outline focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-all outline-none" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<!-- Log In Button -->
<button class="w-full h-14 bg-secondary-container text-on-primary font-bold rounded-xl text-body-lg shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Log In
            </button>
<!-- Divider -->
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-white/10"></div>
</div>
<div class="relative flex justify-center text-label-sm uppercase">
<span class="bg-primary-container px-4 text-outline">OR</span>
</div>
</div>
<!-- WhatsApp Login Button -->
<button class="w-full h-14 bg-[#25D366] text-white font-bold rounded-xl text-body-lg shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<svg class="w-6 h-6 fill-current" viewbox="0 0 24 24">

</svg>
                Login with WhatsApp
            </button>
</section>

<div class="absolute inset-0 bg-gradient-to-t from-primary-container via-transparent to-transparent"></div>
<div class="absolute bottom-6 left-6 right-6 text-center">
<p class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Digital Prosperity</p>
</div>
</div>
<!-- Create Account Link -->
<p class="mt-md font-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="text-secondary font-bold hover:underline" href="#">Sign Up</a>
</p>
</main>
<!-- Suppressing BottomNavBar and NavigationDrawer as per "The Destination Rule" - Login is a focused journey -->
