            background-color: rgba(15, 20, 25, 0.8);
        }

        .viewfinder-cutout {
            box-shadow: 0 0 0 9999px rgba(0, 21, 127, 0.75);
        }

<body class="bg-background text-on-background overflow-hidden h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full fixed top-0 left-0 z-50 bg-transparent">
<div class="flex items-center gap-4">
<button class="p-2 text-primary hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-secondary">Osusu</h1>
</div>
<button class="p-2 text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">help_outline</span>
</button>
</header>
<!-- Main Viewfinder Section -->
<main class="relative flex-1 flex flex-col items-center justify-center bg-primary-container">
<!-- Live Camera Feed Simulation -->
<div class="absolute inset-0 z-0">
<img alt="Camera Viewfinder" class="w-full h-full object-cover opacity-60 grayscale-[0.3] brightness-[0.7]" data-alt="A detailed view through a smartphone camera lens capturing the back of a government identification card placed on a dark, textured slate surface. The lighting is focused and professional, creating a digital vault aesthetic with deep imperial blue shadows. Subtle digital noise and lens artifacts simulate a real-time mobile viewfinder interface, maintaining a high-end fintech visual style with sharp focus on the identification details." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDDAhT4IWQ4Z72F1pUK749rqA7jZuDCGSH2vJlvZNq_QFtCd8p3AZG9gnJ1orpz8_FR3IQa7QRy8ajyMfIVDjEISUZvkmKH_8Gem9evQuxgTYGgqI49JGdyAh_W-ShWS0zriRbcEjROsnlUKhKboFNa3z6DVBgbTiBpMubmpgzb6pN9mfmE169lavkluCrkLHTE64MejLOyTbuAYCCBS_NWbClH7s8OxPNi1fJ8pIptOg1i9Rli9W1w5GN0vPjPJCsRrdjID4Lr-nY"/>
</div>
<!-- Instructional Overlay Text -->
<div class="absolute top-24 z-40 text-center w-full px-margin-mobile">
<h2 class="font-headline-md text-headline-md-mobile text-on-primary-fixed-variant mb-2">Scan the back of your ID</h2>
<p class="font-label-md text-label-md text-on-surface-variant">Align the MRZ code within the highlighted area</p>
</div>
<!-- Viewfinder UI Elements -->
<div class="relative z-30 w-full max-w-[340px] aspect-[1.586/1] flex items-center justify-center">
<!-- Cutout Frame -->
<div class="viewfinder-cutout absolute inset-0 rounded-xl ring-2 ring-white/20"></div>
<!-- Corner Brackets -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-secondary rounded-tl-xl"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-secondary rounded-tr-xl"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-secondary rounded-bl-xl"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-secondary rounded-br-xl"></div>
<!-- MRZ Ghosted Overlay -->
<div class="absolute bottom-4 left-4 right-4 h-12 mrz-ghost-overlay rounded-lg flex flex-col justify-center px-4 gap-1 overflow-hidden opacity-80">
<div class="h-1 w-3/4 bg-white/20 rounded-full"></div>
<div class="h-1 w-full bg-white/20 rounded-full"></div>
<div class="h-1 w-5/6 bg-white/20 rounded-full"></div>
</div>
<!-- Scanning Line -->
<div class="absolute left-0 right-0 h-[2px] bg-secondary-container shadow-[0_0_15px_rgba(255,165,4,0.8)] top-1/4 z-10"></div>
</div>
<!-- Camera Controls -->
<div class="absolute bottom-12 left-0 w-full px-margin-mobile flex items-center justify-around z-40">
<!-- Flash Toggle -->
<button class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-md border border-white/10 flex items-center justify-center text-white hover:bg-white/20 transition-all">
<span class="material-symbols-outlined">flash_on</span>
</button>
<!-- Shutter Button -->
<button class="group relative w-20 h-20 flex items-center justify-center active:scale-90 duration-200">
<div class="absolute inset-0 rounded-full border-4 border-white opacity-50"></div>
<div class="w-16 h-16 rounded-full bg-secondary-container shadow-[0_0_30px_rgba(255,165,4,0.4)] flex items-center justify-center transition-transform group-hover:scale-105">
<span class="material-symbols-outlined text-on-secondary-container text-4xl" data-weight="fill">photo_camera</span>
</div>
</button>
<!-- Gallery/Upload -->
<button class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-md border border-white/10 flex items-center justify-center text-white hover:bg-white/20 transition-all">
<span class="material-symbols-outlined">image</span>
</button>
</div>
<!-- Glass Detail Cards (Communal Prosperity Motif) -->
<div class="absolute bottom-36 px-margin-mobile w-full max-w-md">
<div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-xl p-4 flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-secondary/20 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">security</span>
</div>
<div>
<p class="font-label-md text-label-md text-white">Encryption Active</p>
<p class="font-label-sm text-[10px] text-on-surface-variant uppercase tracking-wider">Secure Vault Processing</p>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Suppressed for Transactional/Linear Journey -->
