<body class="bg-background text-on-background min-h-screen overflow-hidden flex flex-col">

<div class="relative w-full aspect-[1.586/1] flex items-center justify-center">

<div class="absolute bottom-0 right-0 corner-bottom-right"></div>

<div class="w-full h-full rounded-xl border border-white/10 bg-white/5 backdrop-blur-sm flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-white/20 text-6xl" data-icon="credit_card">credit_card</span>
</div>
</div>
<!-- Instruction Text -->
<div class="text-center">
<p class="font-headline-md text-headline-md text-on-primary-fixed mb-base">Align the front of your ID</p>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">Make sure all details are clear and within the frame for instant verification.</p>
</div>
</div>

<div class="absolute bottom-0 left-0 w-full p-xl flex flex-col items-center justify-center z-30">
