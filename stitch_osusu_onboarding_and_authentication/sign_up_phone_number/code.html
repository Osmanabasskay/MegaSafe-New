<style>
        body {
            background-color: #FFFFFF; /* High clarity white background as requested */
            color: #00157f; /* Dark Imperial Blue as requested */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-focus-ring:focus-within {
            border-color: #00157f !important;
            box-shadow: 0 0 0 1px #00157f;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="min-h-screen flex flex-col font-body-md text-body-md bg-white">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full top-0 docked bg-white text-on-primary">
<div class="flex items-center gap-base active:scale-95 duration-150 cursor-pointer">
<span class="material-symbols-outlined text-primary-container" data-icon="arrow_back">arrow_back</span>
</div>
<div class="absolute left-1/2 -translate-x-1/2">
<span class="text-headline-md font-headline-md font-bold text-primary-container">Osusu</span>
</div>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<main class="flex-grow flex flex-col px-margin-mobile pt-lg pb-xl max-w-lg mx-auto w-full">
<!-- Progress Indicator (Subtle) -->
<div class="w-full bg-on-primary/5 h-2 rounded-full mb-lg overflow-hidden">
<div class="bg-secondary-container h-full w-1/4 rounded-full"></div>
</div>
<!-- Hero Section -->
<section class="mb-xl">
<h1 class="font-headline-xl text-headline-xl-mobile md:text-headline-xl mb-base text-primary-container">
                Join Osusu
            </h1>
<p class="font-body-lg text-body-lg text-on-primary/70">
                Enter your WhatsApp number to get started.
            </p>
</section>
<!-- Form Section -->
<div class="space-y-md">
<div class="group">
<label class="font-label-md text-label-md text-primary-container mb-xs block">WhatsApp Number</label>
<div class="flex gap-base h-14 input-focus-ring border-[1.5px] border-primary-container/20 rounded-xl px-base items-center transition-all">
<!-- Country Picker Mock -->
<div class="flex items-center gap-xs pr-base border-r border-primary-container/10 cursor-pointer hover:bg-primary-container/5 h-full transition-colors rounded-l-lg">
<img alt="Nigeria" class="w-6 h-4 rounded-sm object-cover" data-alt="A macro photograph of the Nigerian national flag, featuring its distinct green and white vertical stripes. The fabric texture is visible under soft, studio lighting that highlights the vibrant emerald green and crisp white colors, maintaining a high-contrast corporate modern aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBXG4QBFVPBcEFWkZrDn0X93HxdP55p4BH6NW-epazwtUdtRyDuCF-JiYEtulY9l027-TU6mzlM1WUzg_J--HHOwSHaFqDmAZKj2sW1dZNxHLTuGOvfduBP5q3AH9HYAQ3Dtw2ZQxySOb6eeyPE4JB6GtNdjQUbm9HNABbz82beJNCr0lhr9bPFIsAteui5Ko5MzeMwolHnMKG5xccEKPXhWhvxaHzdjY6oExLkTsJssbr8jjWsy5A2wgeR-7PyZJIPAq_wNqN_uq8"/>
<span class="font-label-md text-label-md text-primary-container">+234</span>
<span class="material-symbols-outlined text-primary-container text-[18px]" data-icon="expand_more">expand_more</span>
</div>
<!-- Number Input -->
<input class="flex-grow bg-transparent border-none focus:ring-0 text-body-lg font-medium text-primary-container placeholder:text-primary-container/30 h-full" placeholder="803 000 0000" type="tel"/>
</div>
</div>
<!-- Context Info -->
<div class="flex items-start gap-base bg-primary-container/5 p-md rounded-xl">
<span class="material-symbols-outlined text-primary-container mt-0.5" data-icon="security">security</span>
<p class="text-label-md text-primary-container/80">
                    We use your WhatsApp number to securely verify your identity and send important contribution updates. No spam, ever.
                </p>
</div>
</div>
<!-- Sticky Bottom Action (on mobile) / Bottom spacing on Desktop -->
<div class="mt-auto pt-xl">
<button class="w-full bg-secondary-container hover:bg-[#e69500] text-white font-headline-md py-4 rounded-xl shadow-[0_10px_30px_rgba(255,165,0,0.2)] transition-all active:scale-95 flex items-center justify-center gap-base">
                Continue
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="mt-md text-center text-label-sm text-primary-container/50">
                By continuing, you agree to Osusu's <a class="underline font-semibold" href="#">Terms of Service</a> and <a class="underline font-semibold" href="#">Privacy Policy</a>.
            </p>
</div>
</main>
<!-- Visual Polish: Bottom Background Element -->
<div class="fixed bottom-0 left-0 w-full h-1/3 -z-10 pointer-events-none overflow-hidden opacity-5">
<div class="absolute -bottom-20 -right-20 w-80 h-80 rounded-full bg-secondary-container blur-3xl"></div>
<div class="absolute -bottom-10 -left-10 w-60 h-60 rounded-full bg-primary-container blur-3xl"></div>
</div>
